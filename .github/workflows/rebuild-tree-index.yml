name: Rebuild Tree Index

on:
  schedule:
    # Daily 06:00 UTC — safety net catches anything the dispatch missed
    - cron: '0 6 * * *'
  repository_dispatch:
    # Reactive: GAS handler pings this after a new tree planting/link event
    types: [tree-index-rebuild]
  workflow_dispatch:
    # Manual trigger from the Actions tab

permissions:
  contents: write

jobs:
  rebuild-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sunmint repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install gspread google-auth

      - name: Run tree index builder
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          # Write service account key to temp file (same pattern as treasury-cache workflows)
          echo "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > /tmp/gcp-key.json
          python3 scripts/build_tree_geojson.py --creds /tmp/gcp-key.json --out .

      - name: Commit and push changes
        run: |
          git config user.name "Sophia Truesight"
          git config user.email "admin+sophia@truesight.me"
          git add trees/index.geojson
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update tree index [$(date -u '+%Y-%m-%d %H:%M UTC')]"
            git push
          fi
