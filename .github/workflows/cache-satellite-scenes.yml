name: Cache Satellite Scenes

on:
  schedule:
    # Daily 06:30 UTC — shortly after the tree index rebuild (06:00)
    - cron: '30 6 * * *'
  workflow_dispatch:
    # Manual trigger from the Actions tab

permissions:
  contents: write

jobs:
  cache-satellite:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sunmint repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run satellite scene cache
        env:
          CDSE_CLIENT_ID: ${{ secrets.CDSE_CLIENT_ID }}
          CDSE_CLIENT_SECRET: ${{ secrets.CDSE_CLIENT_SECRET }}
        # The script degrades gracefully: without CDSE credentials or while the
        # Sentinel-2 collection is not yet exposed it logs a warning and exits 0,
        # so this workflow never fails on missing configuration.
        run: |
          python3 scripts/cache_satellite_scenes.py --index trees/index.geojson --out-dir satellite

      - name: Commit and push changes
        run: |
          git config user.name "Sophia Truesight"
          git config user.email "admin+sophia@truesight.me"
          git add satellite
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update satellite scene cache [$(date -u '+%Y-%m-%d %H:%M UTC')]"
            git push
          fi
